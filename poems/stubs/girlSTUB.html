      Henry Wadsworth Longfellow (1807&nbsp;&ndash;&nbsp;1882)
    </h4>

    <!-- Poem body -->
    <pre class="poem-body">
There was a little <a href="../2.ex_librisPOEM.html" class="poem-link">girl</a>
Who had a little curl
Right in the middle of her forehead.

When she was <a href="../4.march_painPOEM.html" class="poem-link">good</a>,
She was <a href="../4.march_painPOEM.html" class="poem-link">verry verry good</a>
But when she was <a href="../4.march_painPOEM.html" class="poem-link">bad</a>
She was <a href="../7.shut_upPOEM.html" class="poem-link">horrid</a>.

    </pre>
