<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>room 3</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="back-cluster">
  <a href="../" class="back-button" aria-label="return to doors">
    <img src="../../shared_imgs/door_icon.jpg" alt="back" class="back-icon">
    <span class="back-arrow">←</span>
  </a>
</div>
 <!-- start of the image container -->
  <div id="image-container">
    <img class="fade-img" id="imgA" src="images/room3_1.png" />
    <img class="fade-img" id="imgB" src="images/room2_2.png" />
    <img id="pauseImg" class="fade-img" src="room4_pause_screen.png"/>
    <div id="pauseOverlayText">you cannot pause</div>
    <div id="hscroll" class="hscroll"></div>
  <div class="hpanel">1</div>
  <div class="hpanel">2</div>
  <div class="hpanel">3</div>
  </div>

 <!-- start  of the control buttons -->
   <div id="controls" role="region" aria-label="Slideshow controls">
    <!-- Row 1: big “carousel” action  (← ⏯ →) --  -->
    <div class="cp-row cp-row-top">
      <div id="prevBtnWrapper"><button id="prevBtn" aria-label="Previous image">←</button></div>
      <div id="pauseBtnWrapper"><button id="pauseBtn" aria-label="Play / Pause">▶</button></div>
      <div id="nextBtnWrapper"><button id="nextBtn" aria-label="Next image">→</button></div
        >
    </div>

    <!-- JS can toggle/show the slider below when clicked. -->

<!-- Row 2: big “speed” action -->
<div id="fadeSliderGroup" hidden>
  <input 
    type="range" 
    id="fadeSpeedSlider" 
    min="1" max="10" 
    value="7" step="1" 
    orient="vertical" 
    
  />
  <span id="speedVal">4 s</span>
  <div class="speed-label">image speed</div>
</div>


<!-- Row 3: big “carousel” action -->
  <button id="carouselBtn" class="cp-big">on</button>
    <img src="../../shared_imgs/carousel.png" alt="" width="32" height="32" decoding="async">
  </button>
</div>  <!-- this div Ends he control buttons fin-->
 

  <!-- Scripts -->
<!-- CXANGE ROOM STUFF HERE, MOSTLY Load JavaScript after body to ensure DOM is ready -->
<!-- Scripts -->
<script src="room3_imageList.js"></script>
<script src="../shared/fader.js"></script>
<script src="../shared/carousel_bind.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const images = window.room2images;
    if (!Array.isArray(images) || images.length === 0) {
      console.error("[room3] images list missing/empty:", images);
      return;
    }

    startFader(images);
    window.room3Carousel = window.initCarousel({ images});
  });
</script>



</body>
</html>
