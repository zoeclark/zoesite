<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- !!! LOAD SITE FONT — DO NOT REMOVE !!! -->
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text&display=swap" rel="stylesheet">

  <!-- !!! LINK YOUR SINGLE-POEM STYLESHEET — ENSURE PATH IS CORRECT !!! -->
  <!-- If this file lives in /poems/, then single_poem.css should also be in /poems/ -->
  <link rel="stylesheet" href="single_poem.css">

  <!-- !!! OPTIONAL: SET BROWSER TAB TITLE — REPLACE WITH POEM TITLE !!! -->
  <title><!-- PUT BROWSER TAB TITLE HERE -->POEM TITLE</title>
</head>
<body>

  <!-- ===================== BANNER (TOP NAV) ===================== -->
  <!-- !!! KEEP THESE LINKS; UPDATE PATHS ONLY IF YOUR STRUCTURE CHANGES !!! -->
  <div class="poem-banner">
    <!-- LEFT: link back to site root home -->
    <a href="../index.html">home →</a>

    <!-- spacer keeps the two ends apart; style comes from your CSS -->
    <div class="spacer"></div>

    <!-- RIGHT: link back to poems table of contents within /poems/ -->
    <a href="index.html">← Table of Contents</a>
  </div>
  <!-- =================== END BANNER (TOP NAV) =================== -->

  <!-- ===================== POEM CONTAINER ======================= -->
  <div class="poem-container">

    <!-- ======================== TITLE =========================== -->
    <!-- !!! PUT TITLE TEXT BETWEEN THE <span> TAGS BELOW !!! -->
    <!-- Tip: If you prefer the title *not* to be a link, remove the <a> and keep plain text -->
    <h1 class="poem-title">
      <!-- PUT TITLE HERE -->
      <span>POEM TITLE</span>
    </h1>
    <!-- ====================== END TITLE ========================= -->

    <!-- ======================== AUTHOR ========================== -->
    <!-- !!! PUT AUTHOR NAME HERE (KEEP 'by' OR REMOVE IF YOU USE DEDICATIONS INSTEAD) !!! -->
    <!-- If you want a dedication instead: replace this block with an <h4> using italics -->
    <h4 class="poem-author">
      <!-- PUT AUTHOR HERE -->
      <span>Author Name</span>
    </h4>
    <!-- ====================== END AUTHOR ======================== -->

    <!-- ======================== POEM BODY ======================== -->
    <!-- Use <pre> so your line breaks and spacing are preserved -->
    <!-- ONE WORD BELOW LINKS BACK TO THE POEMS INDEX (index.html) -->
    <pre class="poem-body">
This is a first pretend line that breathes and looks around.
Here is a second line where the word <a class="poem-link" href="index.html">index</a> is secretly a doorway.
And a final third line, still listening for the click behind its own echo.
    </pre>
    <!-- ====================== END POEM BODY ====================== -->

  </div>
  <!-- =================== END POEM CONTAINER ===================== -->

</body>
</html>
