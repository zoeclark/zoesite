    const backgrounds = ['#130211', '#121715'];
    document.body.style.backgroundColor = backgrounds[Math.floor(Math.random() * backgrounds.length)];

    function updateWord() {
      const roll = Math.floor(Math.random() * 7); // 0 to 6
      const word = roll === 0 ? 'Sacred' : 'Scared';
      document.getElementById('swap-word').textContent = word;
    }
    updateWord();
    setInterval(updateWord, 3000);
  </script>
