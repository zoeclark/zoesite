<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>room 4</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>

 <!-- CXANGE room # stuffer here 1234 -->

  <div id="image-container">
    <img class="fade-img" id="imgA" src="images/room4_1.png" />
    <img class="fade-img" id="imgB" src="images/room4_2.png" />
    <img id="pauseImg" class="fade-img" src="room4_pause_screen.png"/>
    <div id="pauseOverlayText">you cannot pause</div>
    <div id="hscroll" class="hscroll"></div>
  </div>

   <div id="controls" role="region" aria-label="Slideshow controls">
    <!-- Row 1: transport (← ⏯ →) -->
    <div class="cp-row cp-row-top">
      <div id="prevBtnWrapper"><button id="prevBtn" aria-label="Previous image">←</button></div>
      <div id="pauseBtnWrapper"><button id="pauseBtn" aria-label="Play / Pause">▶</button></div>
      <div id="nextBtnWrapper"><button id="nextBtn" aria-label="Next image">→</button></div>
    </div>

    <!-- JS can toggle/show the slider below when clicked. -->
    <!-- Row 2: big “speed” action -->

<div id="fadeSliderGroup" hidden>
  <input 
    type="range" 
    id="fadeSpeedSlider" 
    min="1" max="10" 
    value="7" step="1" 
    orient="vertical" 
  />
  <span id="speedVal">5</span>
  <div class="speed-label">image speed</div>
</div>

<!-- Row 3: big “carousel” action -->
<div class="cp-row">
  <button id="carouselBtn" class="cp-big">on</button>

    <img src="../../shared_imgs/carousel.png" alt="" width="32" height="32" decoding="async">

  </button>
</div>

  <!-- end of the control buttons -->
  </div>

  <!-- SCRIPTS -->
<!-- Load JavaScript after body to ensure DOM is ready -->
 <!-- CHXANGE ROOOM number stuff here 1234-->
<!-- Scripts -->
<script src="room4_imageList.js"></script>
<script src="../shared/fader.js"></script>
<script src="../shared/carousel_bind.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const images = window.room4images;
    if (!Array.isArray(images) || images.length === 0) {
      console.error("[room4] images list missing/empty:", images);
      return;
    }

    startFader(images);
    window.room4Carousel = window.initCarousel({ images});
  });
</script>

</body>
</html>

<!-- FIN -->
