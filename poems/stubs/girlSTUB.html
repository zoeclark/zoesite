    <!-- Title -->
    <h1 class="poem-title">There Was A Girl</h1>

    <!-- Author -->
    <h4 class="poem-author">Henry Wadsworth Longfellow (1807 - 1882)</h4>

    <!-- Poem body -->
    <pre class="poem-body">
There was a little <a href="../2.ex_librisPOEM.html" class="poem-link">girl</a>
Who had a little curl
Right in the middle of her forehead.

When she was good,
She was very very good
But when she was bad
She was <a href="../7.shut_upPOEM.html" class="poem-link">horrid</a>.

    </pre>
